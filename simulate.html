<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simule — Simulazione</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
  <style>
    body { overflow: hidden; }

    #maplibre-container { position: absolute; inset: 0; }

    /* Street view overlay (road mode, sopra MapLibre) */
    #street-view-wrap {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      overflow: hidden; transition: background 0.4s;
    }
    #mly-viewer { position: absolute; inset: 0; visibility: hidden; }
    #street-view-img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; }
    #no-image-badge {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(10,12,15,0.75); border: 1px solid var(--border);
      border-radius: 100px; padding: 5px 14px;
      font-size: 12px; color: var(--muted); white-space: nowrap;
      backdrop-filter: blur(6px); display: none; z-index: 2;
    }

    /* Video embed view */
    #video-view { position: absolute; inset: 0; background: #000; display: none; }
    #yt-player-wrap { width: 100%; height: 100%; }
    #mp4-player { width: 100%; height: 100%; object-fit: cover; display: none; }

    /* PiP mini-map (in video mode) */
    #pip-map-wrap {
      position: absolute; bottom: 80px; left: 12px;
      width: 220px; height: 140px; border-radius: 10px;
      overflow: hidden; display: none; z-index: 5;
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    }

    /* Video rate badge */
    #video-sync-badge {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      background: rgba(10,12,15,0.78); border: 1px solid var(--border);
      border-radius: 100px; padding: 5px 16px;
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
      font-size: 13px; color: var(--accent2);
      backdrop-filter: blur(6px); display: none; z-index: 6;
    }

    /* Grade color classes */
    .grade-down { color: var(--down); }
    .grade-flat { color: var(--accent); }
    .grade-mid  { color: var(--warn); }
    .grade-high { color: var(--danger); }

    /* Pace input overlay */
    #pace-input-overlay {
      position: fixed; inset: 0; background: rgba(10,12,15,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 100; backdrop-filter: blur(8px);
    }
    #pace-input-overlay.hidden { display: none; }
    .pace-input-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 32px; min-width: 280px; text-align: center;
    }
    .pace-input-card h2 {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; margin-bottom: 20px;
    }
    .pace-dial { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 24px; }
    .pace-dial-value {
      font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 56px;
      color: var(--text); min-width: 140px;
    }
    .pace-dial-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--surface2); border: 1px solid var(--border);
      font-size: 22px; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; user-select: none;
    }
    .pace-dial-btn:active { background: var(--border); }

    /* Sensor overlay */
    #sensor-overlay {
      position: fixed; inset: 0; background: rgba(10,12,15,0.9);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; backdrop-filter: blur(8px);
    }
    #sensor-overlay.hidden { display: none; }
    .sensor-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 32px; min-width: 300px; max-width: 400px; text-align: center;
    }
    .sensor-card h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px; margin-bottom: 8px; }
    .sensor-card p  { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .sensor-status  { font-size: 13px; color: var(--muted); margin-top: 12px; min-height: 18px; }
  </style>
</head>
<body>

<div class="simulate-layout">
  <div id="view-container">
    <!-- MapLibre: sempre sfondo (city in road, satellite+3D in trail) -->
    <div id="maplibre-container"></div>

    <!-- Street view overlay (road mode senza video) -->
    <div id="street-view-wrap">
      <div id="mly-viewer"></div>
      <img id="street-view-img" src="" alt="Street view" style="display:none">
      <div id="no-image-badge">🗺 Mappa attiva</div>
    </div>

    <!-- Video embed (sostituisce tutto quando attivo) -->
    <div id="video-view">
      <div id="yt-player-wrap"></div>
      <video id="mp4-player" playsinline></video>
    </div>

    <!-- PiP mini-map (visibile in video mode) -->
    <div id="pip-map-wrap">
      <div id="pip-map" style="width:100%;height:100%;"></div>
    </div>

    <!-- Badge velocità video -->
    <div id="video-sync-badge">▶ ×1.00</div>
  </div>

  <!-- HUD -->
  <div class="hud" id="hud">
    <div class="hud-topbar">
      <div class="hud-logo">SIMULE</div>
      <div class="hud-route-info">
        <div class="hud-route-name" id="hud-route-name">—</div>
        <div class="hud-route-mode" id="hud-route-mode">—</div>
      </div>
    </div>

    <div class="hud-grade" id="hud-grade-wrap">
      <div class="grade-value grade-flat" id="hud-grade">+0.0%</div>
      <div class="grade-label">Pendenza</div>
    </div>

    <div class="hud-lookahead" id="hud-lookahead">⚠ +0% tra 0m</div>

    <div class="hud-stats">
      <div class="hud-stat">
        <span class="hud-stat-label">Percorsi</span>
        <span class="hud-stat-value" id="stat-done">0.00 <span class="unit">km</span></span>
      </div>
      <div class="hud-stat">
        <span class="hud-stat-label">Rimanenti</span>
        <span class="hud-stat-value" id="stat-remaining">— <span class="unit">km</span></span>
      </div>
      <div class="hud-stat">
        <span class="hud-stat-label">Quota</span>
        <span class="hud-stat-value" id="stat-ele">— <span class="unit">m</span></span>
      </div>
      <div class="hud-stat">
        <span class="hud-stat-label">Dislivello +</span>
        <span class="hud-stat-value" id="stat-elev-gain">+0 <span class="unit">m</span></span>
      </div>
      <div class="hud-stat">
        <span class="hud-stat-label">Pace</span>
        <span class="hud-stat-value" id="stat-pace">—:— <span class="unit">/km</span></span>
      </div>
    </div>

    <div class="hud-elevation">
      <div class="elevation-strip-bg">
        <svg id="elevation-strip-svg" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div class="hud-controls" id="controls-bar">
      <button class="ctrl-btn exit" id="btn-exit" title="Esci" aria-label="Esci">✕</button>
      <button class="ctrl-btn" id="btn-rewind" title="-500m" aria-label="Indietro 500m">⏮</button>

      <div class="pace-controls" id="pace-controls">
        <button class="pace-adj-btn" id="btn-pace-down" aria-label="Rallenta">
          <span style="font-size:20px">−</span>
          <span class="pace-delta">0:05</span>
        </button>
        <div>
          <div class="pace-display" id="pace-live">6:00</div>
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);text-align:center;display:block">/km</span>
        </div>
        <button class="pace-adj-btn" id="btn-pace-up" aria-label="Accelera">
          <span style="font-size:20px">+</span>
          <span class="pace-delta">0:05</span>
        </button>
      </div>

      <button class="ctrl-btn play-pause" id="btn-play" title="Play/Pausa" aria-label="Play/Pausa">▶</button>
      <button class="ctrl-btn" id="btn-forward" title="+500m" aria-label="Avanti 500m">⏭</button>

      <div style="display:flex;gap:4px">
        <button class="multiplier-btn" data-mult="0.5">×0.5</button>
        <button class="multiplier-btn active" data-mult="1">×1</button>
        <button class="multiplier-btn" data-mult="1.5">×1.5</button>
        <button class="multiplier-btn" data-mult="2">×2</button>
      </div>
    </div>
  </div>
</div>

<!-- Overlay pace manuale -->
<div id="pace-input-overlay" class="hidden">
  <div class="pace-input-card">
    <h2>Imposta il tuo pace</h2>
    <div class="pace-dial">
      <button class="pace-dial-btn" id="dial-down">−</button>
      <div class="pace-dial-value" id="dial-value">6:00</div>
      <button class="pace-dial-btn" id="dial-up">+</button>
    </div>
    <button class="btn btn-primary btn-lg" id="btn-confirm-pace" style="width:100%">Inizia simulazione ▶</button>
  </div>
</div>

<!-- Overlay connessione sensore BLE/GPS -->
<div id="sensor-overlay" class="hidden">
  <div class="sensor-card">
    <h2 id="sensor-overlay-title">Connessione sensore</h2>
    <p id="sensor-overlay-desc">Connessione in corso…</p>
    <button class="btn btn-primary" id="btn-sensor-connect" style="width:100%">Connetti</button>
    <button class="btn btn-secondary" id="btn-sensor-skip" style="width:100%;margin-top:8px">Usa input manuale</button>
    <div class="sensor-status" id="sensor-status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script type="module">
import store from './js/store.js';
import sensors from './js/sensors.js';
import simulator from './js/simulator.js';
import { parseGPXString } from './js/gpx-parser.js';
import { buildElevationProfile } from './js/grade-calc.js';
import MaplibreView from './js/maplibre-view.js';
import StreetView from './js/streetview.js';
import debug from './js/debug.js';

let route = null;
let meta = null;
let maplibreView = null;
let streetView = null;
let pipMap = null;
let pipMarker = null;
let ytPlayer = null;
let videoEl = null;
let videoMeta = null;
let isRoadMode = false;
let maplibreLoaded = false;
let prevEle = null;
let totalElevGain = 0;
let lastElevStrip = 0;
let lfMap = null;
let lfMarker = null;
let currentSimDist = 0; // aggiornato da handleSimulatorUpdate, usato per risincronizzare il video

// ---- Carica percorso ----
async function init() {
  const routeId = sessionStorage.getItem('simule_active_route_id');
  route = store.route;
  meta = store.routeMeta;

  if (!route && routeId) {
    const routeObj = store.recentRoutes.find(r => r.id === routeId);
    if (routeObj) {
      route = await parseGPXString(routeObj.gpx_data);
      meta = routeObj;
      store.set('route', route);
      store.set('routeMeta', meta);
    }
  }

  if (!route) { window.location.href = 'index.html'; return; }

  isRoadMode = meta.mode === 'road';
  videoMeta = meta.video || null;

  document.getElementById('hud-route-name').textContent = meta.name;
  document.getElementById('hud-route-mode').textContent = isRoadMode ? '🏙 Road' : '🏔 Trail';
  document.getElementById('stat-remaining').innerHTML =
    `${(route[route.length-1].dist_from_start/1000).toFixed(2)} <span class="unit">km</span>`;

  simulator.init(route);
  simulator.onUpdate(handleSimulatorUpdate);

  await initView();
  initSensorOverlay();
  initControls();
  renderElevationStrip(0);
}

// ---- Inizializza vista ----
async function initView() {
  // MapLibre sempre presente come sfondo
  if (typeof maplibregl !== 'undefined') {
    maplibreView = new MaplibreView();
    try {
      await maplibreView.init('maplibre-container', route, isRoadMode ? 'road' : 'offroad');
      maplibreLoaded = true;
      debug.log(`MapLibre pronto — ${isRoadMode ? 'road' : 'offroad'}`);
    } catch (e) {
      debug.warn('MapLibre fallback a Leaflet:', e);
      initLeafletBg();
    }
  } else {
    initLeafletBg();
  }

  if (videoMeta) {
    // Modalità video: video in primo piano, PiP map in basso a sinistra
    document.getElementById('video-view').style.display = 'block';
    document.getElementById('pip-map-wrap').style.display = 'block';
    document.getElementById('video-sync-badge').style.display = 'block';
    initPipMap();
    initVideoPlayer();
  } else if (isRoadMode) {
    // Road senza video: streetview 360° overlay sopra MapLibre satellite
    const svWrap = document.getElementById('street-view-wrap');
    svWrap.style.display = 'flex';
    svWrap.style.background = 'transparent';
    streetView = new StreetView();
    streetView.init(
      document.getElementById('street-view-img'),
      document.getElementById('no-image-badge'),
      svWrap,
      document.getElementById('mly-viewer')
    );
    // Carica mapillary-js e inizializza viewer 360° interattivo
    await loadMapillaryJS();
    const mlyToken = store.prefs.mapillary_token;
    if (window.mapillary?.Viewer && mlyToken) {
      try {
        const viewer = new mapillary.Viewer({
          accessToken: mlyToken,
          container: document.getElementById('mly-viewer'),
          component: { cover: false, sequence: false }
        });
        streetView.setMapillaryViewer(viewer);
        debug.log('Mapillary viewer 360° pronto');
      } catch (e) {
        debug.warn('Mapillary Viewer init fallback a img statica:', e);
      }
    }
  }
  // Trail senza video: solo MapLibre 3D satellite (nessun overlay)
}

function initLeafletBg() {
  const color = isRoadMode ? '#00b8ff' : '#00e5a0';
  const latlngs = route.map(p => [p.lat, p.lon]);
  lfMap = L.map('maplibre-container', { zoomControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OSM', className: 'lf-bg-dark'
  }).addTo(lfMap);
  document.head.insertAdjacentHTML('beforeend',
    '<style>.lf-bg-dark{filter:brightness(0.7)saturate(0.5)hue-rotate(180deg)invert(1)}</style>');
  L.polyline(latlngs, { color, weight: 4, opacity: 0.85 }).addTo(lfMap);
  const el = document.createElement('div');
  el.style.cssText = `width:14px;height:14px;background:${color};border:3px solid white;border-radius:50%;`;
  lfMarker = L.marker(latlngs[0], {
    icon: L.divIcon({ html: el.outerHTML, className: '', iconSize: [14,14], iconAnchor: [7,7] })
  }).addTo(lfMap);
  lfMap.fitBounds(L.latLngBounds(latlngs), { padding: [40,40] });
}

// ---- PiP mini-map ----
function initPipMap() {
  const color = isRoadMode ? '#00b8ff' : '#00e5a0';
  const latlngs = route.map(p => [p.lat, p.lon]);
  pipMap = L.map('pip-map', { zoomControl: false, attributionControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    className: 'pip-dark'
  }).addTo(pipMap);
  document.head.insertAdjacentHTML('beforeend',
    '<style>.pip-dark{filter:brightness(0.6)saturate(0.4)hue-rotate(180deg)invert(1)}</style>');
  L.polyline(latlngs, { color, weight: 3, opacity: 0.8 }).addTo(pipMap);
  const el = document.createElement('div');
  el.style.cssText = `width:10px;height:10px;background:${color};border:2px solid white;border-radius:50%;`;
  pipMarker = L.marker(latlngs[0], {
    icon: L.divIcon({ html: el.outerHTML, className: '', iconSize: [10,10], iconAnchor: [5,5] })
  }).addTo(pipMap);
  pipMap.setView(latlngs[0], 14);
}

// ---- Video player ----
function initVideoPlayer() {
  if (!videoMeta) return;
  if (videoMeta.type === 'youtube') {
    loadYouTubePlayer(videoMeta.id);
    startVideoResyncLoop();
  } else if (videoMeta.type === 'mp4') {
    videoEl = document.getElementById('mp4-player');
    videoEl.src = videoMeta.url;
    videoEl.style.display = 'block';
    videoEl.play().catch(() => {});
  }
}

function loadYouTubePlayer(videoId) {
  const doInit = () => {
    ytPlayer = new YT.Player('yt-player-wrap', {
      videoId,
      playerVars: { autoplay: 1, controls: 1, modestbranding: 1, rel: 0, iv_load_policy: 3 },
      events: {
        onReady: e => e.target.setPlaybackRate(1),
        onStateChange: onYTStateChange
      }
    });
  };
  if (window.YT?.Player) { doInit(); return; }
  window.onYouTubeIframeAPIReady = doInit;
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}

function onYTStateChange(e) {
  const badge = document.getElementById('video-sync-badge');
  // State 3 = buffering (possibile inizio pubblicità o rebuffer di rete)
  if (e.data === 3) {
    if (badge) badge.textContent = '⏸ Caricamento…';
    return;
  }
  // State 1 = playing: se arriviamo dallo stato buffering/pausa, risincronizzare
  if (e.data === 1) {
    // Piccolo delay per lasciar stabilizzare il player dopo la pubblicità
    setTimeout(() => resyncVideoToRoute(true), 400);
  }
}

// Risincronizza la posizione del video alla posizione attuale del runner.
// forceSeek=true salta sempre se il drift è oltre soglia;
// forceSeek=false (controllo periodico) usa soglia più alta per non disturbare la visione normale.
function resyncVideoToRoute(forceSeek = false) {
  if (!ytPlayer || !videoMeta?.durationSeconds) return;
  const routeLen = route[route.length - 1].dist_from_start;
  const expectedTime = (currentSimDist / routeLen) * videoMeta.durationSeconds;
  let actualTime;
  try { actualTime = ytPlayer.getCurrentTime(); } catch { return; }

  const drift = Math.abs(actualTime - expectedTime);
  // Dopo un'interruzione pubblicitaria forziamo la risincronizzazione con soglia bassa (5s);
  // nel controllo periodico usiamo 20s per non interrompere la visione se il runner
  // ha cambiato passo di poco.
  const threshold = forceSeek ? 5 : 20;
  if (drift > threshold) {
    try { ytPlayer.seekTo(expectedTime, true); } catch {}
    debug.log(`Video risincronizzato: drift=${drift.toFixed(1)}s → seekTo ${expectedTime.toFixed(1)}s`);
  }

  const badge = document.getElementById('video-sync-badge');
  if (badge && ytPlayer.getPlayerState?.() === 1) {
    const rate = snapYTRate(Math.max(0.25, Math.min(2,
      videoMeta.avgSpeedMs > 0 ? (currentSimDist > 0 ? 1 : 1) : 1)));
    badge.textContent = `▶ ×${rate.toFixed(2)}`;
  }
}

// Controllo periodico ogni 10 s: rete di sicurezza contro drift accumulato
function startVideoResyncLoop() {
  setInterval(() => {
    if (videoMeta?.type === 'youtube' && ytPlayer?.getPlayerState?.() === 1) {
      resyncVideoToRoute(false);
    }
  }, 10000);
}

const YT_RATES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];
function snapYTRate(rate) {
  return YT_RATES.reduce((a, b) => Math.abs(b - rate) < Math.abs(a - rate) ? b : a);
}

function syncVideo(speedMs, currentDist) {
  if (!videoMeta || !videoMeta.avgSpeedMs) return;
  currentSimDist = currentDist; // aggiorna per uso in resyncVideoToRoute
  const rate = Math.max(0.25, Math.min(2, speedMs / videoMeta.avgSpeedMs));
  const badge = document.getElementById('video-sync-badge');

  if (videoMeta.type === 'youtube' && ytPlayer?.setPlaybackRate) {
    const snapped = snapYTRate(rate);
    try { ytPlayer.setPlaybackRate(snapped); } catch {}
    // Aggiorna badge solo se non mostra stato di caricamento/pubblicità
    if (badge && !badge.textContent.startsWith('⏸')) {
      badge.textContent = `▶ ×${snapped.toFixed(2)}`;
    }
  } else if (videoEl) {
    videoEl.playbackRate = rate;
    if (badge) badge.textContent = `▶ ×${rate.toFixed(2)}`;
    // Risincronizza posizione MP4 su seek (tolleranza 3s)
    if (videoMeta.durationSeconds > 0) {
      const targetTime = (currentDist / route[route.length-1].dist_from_start) * videoMeta.durationSeconds;
      if (Math.abs(videoEl.currentTime - targetTime) > 3) videoEl.currentTime = targetTime;
    }
  }
}

// ---- Overlay sensore ----
function initSensorOverlay() {
  const sensorType = store.sensorType || 'manual-pace';
  const overlay = document.getElementById('sensor-overlay');
  const LABELS = {
    'ble-ftms':    ['Connetti tapis roulant BLE', 'Premi per cercare il tapis roulant Bluetooth nelle vicinanze.'],
    'ble-hrm-rsc': ['Connetti foot pod BLE', 'Premi per cercare il sensore scarpa (RSC) Bluetooth.'],
    'gps':         ['Attiva GPS', 'Simule utilizzerà il GPS del dispositivo per rilevare la velocità.'],
    'pedometer':   ['Attiva accelerometro', 'Simule utilizzerà il sensore di movimento del dispositivo.']
  };
  const info = LABELS[sensorType];

  if (!info) {
    showManualInput(sensorType);
    return;
  }

  overlay.classList.remove('hidden');
  document.getElementById('sensor-overlay-title').textContent = info[0];
  document.getElementById('sensor-overlay-desc').textContent = info[1];

  document.getElementById('btn-sensor-connect').addEventListener('click', async () => {
    const btn = document.getElementById('btn-sensor-connect');
    const status = document.getElementById('sensor-status');
    btn.disabled = true;
    status.textContent = 'Connessione in corso…';
    try {
      await sensors.connect(sensorType, { stride_length: store.getEffectiveStrideLength(), threshold: store.prefs.stride_threshold || 1.2 });
      sensors.onUpdate(handleSensorUpdate);
      overlay.classList.add('hidden');
      simulator.play();
    } catch (e) {
      status.textContent = 'Errore: ' + (e.message || 'connessione fallita');
      btn.disabled = false;
    }
  });

  document.getElementById('btn-sensor-skip').addEventListener('click', () => {
    overlay.classList.add('hidden');
    showManualInput('manual-pace');
  });
}

function showManualInput(type) {
  if (type === 'manual-speed') { showPaceInput(); return; }
  showPaceInput();
}

function showPaceInput() {
  const overlay = document.getElementById('pace-input-overlay');
  overlay.classList.remove('hidden');
  let paceS = store.prefs.manual_pace_s || 360;

  function updateDial() {
    const min = Math.floor(paceS / 60), sec = paceS % 60;
    document.getElementById('dial-value').textContent = `${min}:${sec.toString().padStart(2,'0')}`;
  }
  updateDial();

  function makeAdjuster(btn, delta) {
    let pt = null, iv = null;
    btn.addEventListener('pointerdown', () => {
      paceS = Math.max(180, Math.min(900, paceS + delta)); updateDial();
      pt = setTimeout(() => { iv = setInterval(() => { paceS = Math.max(180, Math.min(900, paceS + delta)); updateDial(); }, 150); }, 500);
    });
    const stop = () => { clearTimeout(pt); clearInterval(iv); };
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointerleave', stop);
  }

  makeAdjuster(document.getElementById('dial-down'), 5);
  makeAdjuster(document.getElementById('dial-up'), -5);

  document.getElementById('btn-confirm-pace').addEventListener('click', async () => {
    overlay.classList.add('hidden');
    store.setPref('manual_pace_s', paceS);
    await sensors.connect('manual-pace');
    sensors.onUpdate(handleSensorUpdate);
    simulator.play();
    document.getElementById('pace-controls').classList.add('visible');
    updatePaceLiveDisplay();
  });
}

function handleSensorUpdate(data) {
  simulator.setSpeed(data.speed_ms);
  updatePaceLiveDisplay(data.pace_min_km);
}

function updatePaceLiveDisplay(paceMinKm) {
  const el = document.getElementById('pace-live');
  if (!el) return;
  const p = paceMinKm || (store.prefs.manual_pace_s / 60);
  const min = Math.floor(p), sec = Math.round((p - min) * 60);
  el.textContent = `${min}:${sec.toString().padStart(2,'0')}`;
}

// ---- Aggiornamento HUD dal simulator ----
function handleSimulatorUpdate(state) {
  const { current_dist, remaining_dist, current_point, next_point, heading,
          current_grade, lookahead_grade, speed_ms, pace_min_km } = state;

  // Dislivello positivo accumulato
  if (prevEle !== null && current_point.ele > prevEle) totalElevGain += current_point.ele - prevEle;
  prevEle = current_point.ele;

  // Pendenza
  const gradeEl = document.getElementById('hud-grade');
  gradeEl.textContent = `${current_grade >= 0 ? '+' : ''}${current_grade.toFixed(1)}%`;
  gradeEl.className = 'grade-value ' + (current_grade < 0 ? 'grade-down' : current_grade < 5 ? 'grade-flat' : current_grade < 10 ? 'grade-mid' : 'grade-high');

  // Lookahead
  const alertEl = document.getElementById('hud-lookahead');
  if (lookahead_grade) {
    alertEl.textContent = `⚠ +${lookahead_grade.grade}% tra ${lookahead_grade.dist_from_here}m`;
    alertEl.classList.add('visible');
  } else {
    alertEl.classList.remove('visible');
  }

  // Stats
  document.getElementById('stat-done').innerHTML = `${(current_dist/1000).toFixed(2)} <span class="unit">km</span>`;
  document.getElementById('stat-remaining').innerHTML = `${(remaining_dist/1000).toFixed(2)} <span class="unit">km</span>`;
  document.getElementById('stat-ele').innerHTML = `${Math.round(current_point.ele)} <span class="unit">m</span>`;
  document.getElementById('stat-elev-gain').innerHTML = `+${Math.round(totalElevGain)} <span class="unit">m</span>`;

  if (pace_min_km > 0) {
    const min = Math.floor(pace_min_km), sec = Math.round((pace_min_km - min) * 60);
    document.getElementById('stat-pace').innerHTML = `${min}:${sec.toString().padStart(2,'0')} <span class="unit">/km</span>`;
  }

  // Strip altimetrica ogni 250m
  if (Math.abs(current_dist - lastElevStrip) > 250) {
    renderElevationStrip(current_dist);
    lastElevStrip = current_dist;
  }

  // Traccia posizione corrente (usata da resyncVideoToRoute anche quando speed=0)
  currentSimDist = current_dist;

  // Vista principale
  if (videoMeta && speed_ms > 0) {
    syncVideo(speed_ms, current_dist);
  }

  if (videoMeta && pipMarker && pipMap) {
    const ll = [current_point.lat, current_point.lon];
    pipMarker.setLatLng(ll);
    pipMap.setView(ll, 14);
  }

  if (!videoMeta) {
    if (isRoadMode && streetView) {
      streetView.update({ current_point, heading }).catch(() => {});
    }
    if (maplibreLoaded && maplibreView) {
      maplibreView.update({ current_point, next_point, heading });
    } else if (lfMap && lfMarker) {
      const ll = [current_point.lat, current_point.lon];
      lfMarker.setLatLng(ll);
      lfMap.setView(ll, lfMap.getZoom());
    }
  }
}

// ---- Strip altimetrica SVG (con larghezza reale in pixel) ----
function renderElevationStrip(fromDist) {
  const svg = document.getElementById('elevation-strip-svg');
  // Usa la larghezza reale in pixel per evitare scaling del testo
  const W = Math.round(svg.getBoundingClientRect().width) || 600;
  const H = 100;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const WINDOW = 5000;
  const totalRoute = route[route.length - 1].dist_from_start;
  const profile = buildElevationProfile(route, fromDist, WINDOW);
  if (profile.length < 2) return;

  const eles = profile.map(p => p.ele);
  const minE = Math.min(...eles), maxE = Math.max(...eles);
  const range = Math.max(maxE - minE, 30);

  const PX = 6, PY_TOP = 22, PY_BOT = 18;
  const plotH = H - PY_TOP - PY_BOT;

  const toX = i => PX + (i / (profile.length - 1)) * (W - PX * 2);
  const toY = ele => PY_TOP + plotH - ((ele - minE) / range) * plotH;

  const pts = profile.map((p, i) => `${toX(i).toFixed(1)},${toY(p.ele).toFixed(1)}`);
  const pathD = `M${pts.join('L')}`;
  const fillD = `${pathD}L${(W - PX).toFixed(1)},${H}L${PX},${H}Z`;
  const color = isRoadMode ? '#00b8ff' : '#00e5a0';

  // Picchi
  const peaks = findElevationPeaks(eles, 0.2);
  const peaksSVG = peaks.map(pk => {
    const x = toX(pk.idx), y = toY(eles[pk.idx]);
    return `<circle cx="${x}" cy="${y}" r="2.5" fill="${color}" opacity="0.8"/>
    <text x="${x}" y="${y - 5}" fill="${color}" font-size="9" font-family="Barlow Condensed,sans-serif" font-weight="700" text-anchor="middle" opacity="0.9">${Math.round(eles[pk.idx])}m</text>`;
  }).join('');

  // Label km
  const kmInterval = Math.ceil(WINDOW / 1000 / 5) * 1000;
  const kmLabelsSVG = [];
  for (let d = kmInterval; d < WINDOW - 200; d += kmInterval) {
    const idx = Math.round((d / WINDOW) * (profile.length - 1));
    const x = toX(idx);
    const kmVal = ((fromDist + d) / 1000).toFixed(1);
    kmLabelsSVG.push(`<line x1="${x}" y1="${H - PY_BOT}" x2="${x}" y2="${H - PY_BOT + 4}" stroke="${color}" stroke-width="1" opacity="0.4"/>
    <text x="${x}" y="${H - 4}" fill="#5a6878" font-size="9" font-family="Barlow Condensed,sans-serif" text-anchor="middle">${kmVal}km</text>`);
  }

  // Traguardo
  let finishSVG = '';
  const remainInWindow = totalRoute - fromDist;
  if (remainInWindow > 0 && remainInWindow <= WINDOW) {
    const idx = Math.min(Math.round((remainInWindow / WINDOW) * (profile.length - 1)), profile.length - 1);
    const fx = toX(idx), fy = toY(eles[idx]);
    finishSVG = `<line x1="${fx}" y1="${fy}" x2="${fx}" y2="${H - PY_BOT}" stroke="#ff4444" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
    <text x="${fx + 3}" y="${PY_TOP - 4}" fill="#ff4444" font-size="9" font-family="Barlow Condensed,sans-serif" font-weight="700">ARRIVO</text>`;
  }

  // Cursore + quota corrente
  const curX = PX, curY = toY(eles[0]);

  svg.innerHTML = `
    <defs>
      <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0.04"/>
      </linearGradient>
    </defs>
    <path d="${fillD}" fill="url(#sg)"/>
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="1.8"/>
    ${peaksSVG}
    ${kmLabelsSVG.join('')}
    ${finishSVG}
    <text x="${curX + 10}" y="${curY - 5}" fill="white" font-size="9" font-family="Barlow Condensed,sans-serif" font-weight="700" opacity="0.9">${Math.round(eles[0])}m</text>
    <circle cx="${curX}" cy="${curY}" r="5" fill="${color}" stroke="white" stroke-width="2.5">
      <animate attributeName="r" values="5;7;5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  `;
}

function findElevationPeaks(eles, minRelativeHeight = 0.2) {
  const minE = Math.min(...eles), maxE = Math.max(...eles);
  const threshold = minE + (maxE - minE) * minRelativeHeight;
  const peaks = [];
  for (let i = 3; i < eles.length - 3; i++) {
    if (eles[i] < threshold) continue;
    if (eles[i] > eles[i-1] && eles[i] > eles[i+1] && eles[i] >= eles[i-2] && eles[i] >= eles[i+2]) {
      peaks.push({ idx: i });
    }
  }
  peaks.sort((a, b) => eles[b.idx] - eles[a.idx]);
  const minSep = Math.floor(eles.length * 0.15);
  const filtered = [];
  for (const pk of peaks) {
    if (filtered.every(f => Math.abs(f.idx - pk.idx) >= minSep)) {
      filtered.push(pk);
      if (filtered.length >= 3) break;
    }
  }
  return filtered;
}

// ---- Controls ----
function initControls() {
  document.getElementById('btn-exit').addEventListener('click', () => {
    simulator.pause();
    sensors.disconnect();
    window.location.href = 'preview.html';
  });
  document.getElementById('btn-rewind').addEventListener('click', () => simulator.seekBy(-500));
  document.getElementById('btn-forward').addEventListener('click', () => simulator.seekBy(500));

  const btnPlay = document.getElementById('btn-play');
  btnPlay.addEventListener('click', () => {
    simulator.toggle();
    btnPlay.textContent = simulator.isPlaying() ? '⏸' : '▶';
    if (videoMeta) {
      if (ytPlayer?.playVideo) simulator.isPlaying() ? ytPlayer.playVideo() : ytPlayer.pauseVideo();
      if (videoEl) simulator.isPlaying() ? videoEl.play() : videoEl.pause();
    }
  });

  document.querySelectorAll('.multiplier-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      simulator.setMultiplier(parseFloat(btn.dataset.mult));
      document.querySelectorAll('.multiplier-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  function makePaceBtn(btn, delta) {
    let pt = null, iv = null;
    btn.addEventListener('pointerdown', () => {
      sensors.adjustPace(delta); updatePaceLiveDisplay();
      pt = setTimeout(() => { iv = setInterval(() => { sensors.adjustPace(delta); updatePaceLiveDisplay(); }, 300); }, 600);
    });
    const stop = () => { clearTimeout(pt); clearInterval(iv); };
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointerleave', stop);
  }
  makePaceBtn(document.getElementById('btn-pace-down'), 5);
  makePaceBtn(document.getElementById('btn-pace-up'), -5);

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
      simulator.toggle();
      btnPlay.textContent = simulator.isPlaying() ? '⏸' : '▶';
    }
    if (e.code === 'ArrowRight') simulator.seekBy(100);
    if (e.code === 'ArrowLeft')  simulator.seekBy(-100);
  });
}

// ---- Mapillary JS lazy load ----
async function loadMapillaryJS() {
  return new Promise(resolve => {
    if (window.mapillary?.Viewer) { resolve(); return; }
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://unpkg.com/mapillary-js@4/dist/mapillary.min.css';
    document.head.appendChild(link);
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/mapillary-js@4/dist/mapillary.min.js';
    script.onload = resolve; script.onerror = resolve;
    document.head.appendChild(script);
  });
}

// ---- MapLibre lazy load ----
async function loadMapLibre() {
  return new Promise(resolve => {
    if (typeof maplibregl !== 'undefined') { resolve(); return; }
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js';
    script.onload = resolve; script.onerror = resolve;
    document.head.appendChild(script);
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css';
    document.head.appendChild(link);
  });
}

// ---- Boot ----
(async () => {
  await loadMapLibre();
  await init();
})();
</script>
